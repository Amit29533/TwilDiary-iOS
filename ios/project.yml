name: TwilDiary
options:
  bundleIdPrefix: com.amit29533
  deploymentTarget:
    iOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    IPHONEOS_DEPLOYMENT_TARGET: '26.0'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGNING_ALLOWED: NO
packages:
  TwilDiaryCore:
    path: Packages/TwilDiaryCore
targets:
  TwilDiary:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [PrivacyInfo.xcprivacy]
      - path: Shared
      - path: App/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - target: TwilDiaryWidgets
        embed: true
      - sdk: AppIntents.framework
      - package: TwilDiaryCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amit29533.TwilDiary
        TWILDIARY_TRAKT_CLIENT_ID: 'pf247BS4jiJkBk_ccJhSS1menwegnU_EuT5MNUDmvu8'
        TWILDIARY_SIMKL_CLIENT_ID: 'b8a8608d8971e7efeb787d21fde2e236704c066749a9bb2cc1367314421d657e'
        TWILDIARY_MDBLIST_CLIENT_ID: 'Eag63uTbztrOAYB4kh0kganxsR4aqwm6MDz9tmdb'
        # TMDB key: never in git (public repo). Passed when building: TWILDIARY_TMDB_KEY=… (see CODEMAGIC.md).
        TWILDIARY_TMDB_KEY: ''
        # Gemini key for search by description: never in git either (TWILDIARY_GEMINI_KEY=… when building).
        TWILDIARY_GEMINI_KEY: ''
        # Groq keys (the AI backup), the same way: TWILDIARY_GROQ_KEY=… when building, commas between several.
        TWILDIARY_GROQ_KEY: ''
        TWILDIARY_WETRAKR_CLIENT_ID: '91c4eb76647493ae988793b9f3b62a53'
        TWILDIARY_GOOGLE_CLIENT_ID: '727001532186-pv7dsdmdplgeipmvei3pgscun46jf8u9.apps.googleusercontent.com'
        MARKETING_VERSION: '2.0.0'
        CURRENT_PROJECT_VERSION: '67'
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Support/Info.plist
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: TwilDiary reads your Jellyfin server on your home network to find where your movies and shows are stored.
        # A person's photo viewer: Download saves the picture to Photos.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: TwilDiary saves the photos you download to your photo library.
        INFOPLIST_KEY_CFBundleDisplayName: TwilDiary
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_NSSupportsLiveActivitiesFrequentUpdates: YES
        # Settings → Sync & backup keeps daily copies in Files → On My iPhone → TwilDiary.
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        TARGETED_DEVICE_FAMILY: '1'
      configs:
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: 'catalog-*.json trakt-*.json reference-workspace.json'
  TwilDiaryWidgets:
    type: app-extension
    platform: iOS
    sources: [Widgets, Shared]
    dependencies:
      - package: TwilDiaryCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amit29533.TwilDiary.widgets
        MARKETING_VERSION: '2.0.0'
        CURRENT_PROJECT_VERSION: '67'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Support/Widgets-Info.plist
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: '1'
  TwilDiaryTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: TwilDiary
      - package: TwilDiaryCore
        product: TwilDiaryTestSupport
      - sdk: AppIntents.framework
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  TwilDiaryUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: TwilDiary
      - sdk: AppIntents.framework
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TwilDiary:
    build:
      targets:
        TwilDiary: all
        TwilDiaryTests: [test]
        TwilDiaryUITests: [test]
    test:
      gatherCoverageData: true
      targets: [TwilDiaryTests, TwilDiaryUITests]

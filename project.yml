name: TwilDiary
options:
  bundleIdPrefix: com.amit29533
  deploymentTarget:
    iOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    IPHONEOS_DEPLOYMENT_TARGET: '26.0'
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  TwilDiaryCore:
    path: Packages/TwilDiaryCore
targets:
  TwilDiary:
    type: application
    platform: iOS
    sources: [TwilDiary]
    dependencies:
      - package: TwilDiaryCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amit29533.TwilDiary
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: '2.0.0'
        CURRENT_PROJECT_VERSION: '1'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: TwilDiary
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: '1,2'
  TwilDiaryUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [TwilDiaryUITests]
    dependencies:
      - target: TwilDiary
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TwilDiary:
    build:
      targets:
        TwilDiary: all
        TwilDiaryUITests: [test]
    test:
      targets: [TwilDiaryUITests]

name: Native iOS owner device diagnostic
run-name: Device diagnostic from run 40549339430 at 6a2b723
# Temporary packaging branch only. This cannot qualify ios-prerelease.yml:
# it is not an ios-dev ui=full run, does not claim regression acceptance,
# and does not change the stable Codemagic/same-SHA verification gate.
on:
  workflow_dispatch:
    inputs:
      ui:
        description: 'Compatibility input; this workflow only packages the requested device diagnostic'
        default: none
        type: choice
        options: [none]
permissions:
  contents: read
concurrency:
  group: owner-ipa-40549339430
  cancel-in-progress: false
jobs:
  package-requested-source:
    runs-on: macos-26-intel
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 6a2b723751ec99faab12f5b86c01fb372743acf6
          persist-credentials: false
      - name: Verify requested source and record the toolchain
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '6a2b723751ec99faab12f5b86c01fb372743acf6'
          mkdir -p ios/.artifacts/logs
          { sw_vers; xcodebuild -version; xcrun --sdk iphoneos --show-sdk-version; } | tee ios/.artifacts/toolchain.txt
      - name: Generate Xcode project
        run: bash ios/scripts/xcodegen.sh
      - name: Compile the unchanged unsigned iPhone app
        run: bash ios/scripts/ci.sh build-device
      - name: Verify release resources and package the IPA
        run: bash ios/scripts/ci.sh package
      - name: Record diagnostic provenance without claiming UI acceptance
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, plistlib, shutil
          root = pathlib.Path('ios/.artifacts')
          target = root / 'owner-ipa'
          target.mkdir()
          ipa = target / 'TwilDiary-native65-6a2b723-diagnostic.ipa'
          shutil.copyfile(root / 'TwilDiary-unsigned.ipa', ipa)
          digest = hashlib.sha256(ipa.read_bytes()).hexdigest()
          info = plistlib.loads(pathlib.Path('ios/.derived/device/Build/Products/Release-iphoneos/TwilDiary.app/Info.plist').read_bytes())
          assert info['CFBundleVersion'] == '65'
          assert 'iPhoneOS' in info['CFBundleSupportedPlatforms']
          (target / (ipa.name + '.sha256')).write_text(digest + '  ' + ipa.name + '\n')
          proof = {
              'kind': 'owner-device-diagnostic',
              'sourceSHA': '6a2b723751ec99faab12f5b86c01fb372743acf6',
              'originalRun': 'https://github.com/Amit29533/TwilDiary-iOS/actions/runs/40549339430',
              'originalUIRegression': 'failed; this rebuild does not override that result',
              'regressionAcceptance': False,
              'packagingRun': os.environ['GITHUB_SERVER_URL'] + '/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID'],
              'version': info['CFBundleShortVersionString'],
              'build': info['CFBundleVersion'],
              'signing': 'unsigned, for owner LiveContainer/device testing',
              'ipaSHA256': digest,
          }
          (target / 'provenance.json').write_text(json.dumps(proof, indent=2) + '\n')
          print('Packaged build 65 from the exact requested app source; UI regression acceptance is false.')
          PY
      - name: Upload requested test IPA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TwilDiary-native65-6a2b723-diagnostic
          path: ios/.artifacts/owner-ipa/*
          if-no-files-found: error
          retention-days: 14
      - name: Retain packaging diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TwilDiary-native65-packaging-logs
          path: |
            ios/.artifacts/logs
            ios/.artifacts/toolchain.txt
          if-no-files-found: warn
          retention-days: 14

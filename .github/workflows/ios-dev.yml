name: Native iOS development checks
# Fast feedback for unreleased work branches. This workflow never signs, packages,
# publishes or deploys anything, never uses hosted diary credentials, and does not
# qualify a stable build: Codemagic plus ios.yml remain the stable release path.
# A complete-scope pass (ui=full) is the evidence ios-prerelease.yml requires.
run-name: ios-dev ui=${{ github.event_name == 'workflow_dispatch' && inputs.ui || 'repairs' }} ${{ github.ref_name }}
on:
  push:
    branches: ['claude/**']
    paths:
      - 'ios/**'
      - '.github/workflows/ios-dev.yml'
  workflow_dispatch:
    inputs:
      ui:
        description: 'UI regression scope after unit tests'
        type: choice
        default: repairs
        options: [none, repairs, full]
permissions:
  contents: read
  checks: write
concurrency:
  group: ios-dev-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: macos-26-intel
    timeout-minutes: 200
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: '1'
      UI_SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.ui || 'repairs' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Inspect pinned toolchain and choose available iPhone
        run: bash ios/scripts/ci.sh inventory
      - name: Cache Swift packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ios/.spm
          key: spm-macos26-${{ runner.arch }}-xcode26.6-${{ hashFiles('ios/**/Package.resolved', 'ios/**/Package.swift', 'ios/project.yml') }}
      - name: Generate Xcode project
        run: bash ios/scripts/xcodegen.sh
      - name: Test core calculations and catalog contracts
        timeout-minutes: 20
        run: swift test --package-path ios/Packages/TwilDiaryCore 2>&1 | tee ios/.artifacts/logs/core-tests.log
      - name: Compile simulator and test bundles (warnings are errors)
        id: simulator
        run: bash ios/scripts/ci.sh build-simulator
      - name: Compile Release for a physical iPhone (no signing, not uploaded)
        run: bash ios/scripts/ci.sh build-device
      - name: Wait for simulator readiness
        timeout-minutes: 15
        run: bash ios/scripts/ci.sh boot
      - name: Run native unit tests
        timeout-minutes: 20
        run: bash ios/scripts/ci.sh test-unit
      - name: Run current UI regression gate
        if: ${{ env.UI_SCOPE == 'repairs' }}
        timeout-minutes: 40
        run: bash ios/scripts/ci.sh test-repairs
      - name: Run complete primary iPhone UI regression
        if: ${{ env.UI_SCOPE == 'full' }}
        timeout-minutes: 100
        run: bash ios/scripts/ci.sh test
      - name: Run compact and large iPhone layout regression
        if: ${{ env.UI_SCOPE == 'full' }}
        timeout-minutes: 40
        run: bash ios/scripts/ci.sh test-layouts
      - name: Export screenshots
        if: always()
        run: bash ios/scripts/ci.sh screenshots
      - name: Upload logs, results and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TwilDiary-dev-results
          include-hidden-files: true
          path: |
            ios/.artifacts/*.xcresult
            ios/.artifacts/logs
            ios/.artifacts/screenshots
            ios/.artifacts/toolchain.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Publish diagnostics as a readable check run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          python3 - > "$RUNNER_TEMP/diagnostics.md" <<'PY'
          import pathlib, re
          logs = pathlib.Path('ios/.artifacts/logs')
          seen, lines = set(), []
          for path in sorted(logs.glob('*.log')):
              text = path.read_text(errors='replace').splitlines()
              found = []
              for index, line in enumerate(text):
                  hit = re.search(r'\berror:|Test Case .* failed|\*\* .*FAILED \*\*', line) or (
                      ('build' in path.name or path.name == 'core-tests.log') and re.search(r'\bwarning:', line, re.I))
                  if hit:
                      key = re.sub(r'^.*?/ios/', 'ios/', line.strip())
                      if key not in seen:
                          seen.add(key); found.append(key)
                          # The failing test's own activity precedes its error line.
                          if 'tests' in path.name and 'error:' in line:
                              noise = re.compile(r'Checking existence|IDELaunchParametersSnapshot|Checking `Expect|^\s*$|DIAG ')
                              steps = [extra.strip()[:200] for extra in text[max(0, index - 160):index] if not noise.search(extra)]
                              found.extend('      < ' + step for step in steps[-60:])
              diagnostics = [line.strip()[:240] for line in text if line.lstrip().startswith('DIAG ')]
              if diagnostics:
                  found.append('DIAG lines printed by tests:')
                  found.extend('      ' + line for line in diagnostics[:300])
              if found:
                  lines.append(f'### {path.name}')
                  lines.extend('    ' + item[:600] for item in found[:400])
              elif text and ('FAILED' in text[-1] or path.name.endswith('build.log')):
                  lines.append(f'### {path.name} (tail)')
                  lines.extend('    ' + item[:400] for item in text[-40:])
          body = '\n'.join(lines) or 'No compile errors, warnings or failed tests were found in the logs.'
          print(body[:60000])
          PY
          gh api "repos/$GITHUB_REPOSITORY/check-runs" -f name="ios-dev diagnostics" -f head_sha="$GITHUB_SHA" \
            -f status=completed -f conclusion=neutral -f "output[title]=ios-dev diagnostics" \
            -F "output[summary]=@$RUNNER_TEMP/diagnostics.md" > /dev/null || true
      - name: Fail on any build warning, compile error or failed test
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re, sys
          logs = pathlib.Path('ios/.artifacts/logs')
          problems = []
          for path in sorted(logs.glob('*.log')):
              for line in path.read_text(errors='replace').splitlines():
                  if re.search(r'\berror:|Test Case .* failed', line):
                      problems.append(f'{path.name}: {line.strip()}')
                  elif ('build' in path.name or path.name == 'core-tests.log') and re.search(r'\bwarning:', line, re.I):
                      problems.append(f'{path.name}: {line.strip()}')
          for line in problems[:300]:
              print(line)
          sys.exit(1 if problems else 0)
          PY
  review-screenshots:
    # Downscaled review copies of a complete run, force-pushed to the scratch
    # branch ci-screenshots so they can be read without artifact downloads.
    # Only this small Ubuntu job can write; the macOS build job stays read-only.
    needs: native
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.ui == 'full' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - name: Publish downscaled review screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" -n TwilDiary-dev-results -D results
          python3 -m pip install --quiet --disable-pip-version-check pillow==11.3.0
          python3 - <<'PY'
          import json, os, pathlib, re
          from PIL import Image
          source, target = pathlib.Path('results/screenshots'), pathlib.Path('review')
          target.mkdir()
          names = {}
          for manifest in source.rglob('manifest.json'):
              for test in json.loads(manifest.read_text()):
                  case = str(test.get('testIdentifier', 'case')).split('/')[-1].rstrip('()')
                  for item in test.get('attachments', []):
                      label = item.get('suggestedHumanReadableName') or item.get('exportedFileName', '')
                      names[manifest.parent / item.get('exportedFileName', '')] = case + '__' + label
          count = 0
          for image in sorted(p for p in source.rglob('*') if p.suffix.lower() in ('.png', '.jpg', '.jpeg')):
              label = names.get(image, image.stem)
              suite = image.parent.relative_to(source).as_posix().replace('/', '_') or 'Primary'
              name = re.sub(r'[^A-Za-z0-9._-]+', '-', label)[:150].strip('-') or image.stem
              folder = target / suite
              folder.mkdir(exist_ok=True)
              with Image.open(image) as picture:
                  picture = picture.convert('RGB')
                  picture.thumbnail((520, 1130))
                  picture.save(folder / (name + '.jpg'), quality=72, optimize=True)
              count += 1
          (target / 'README.md').write_text(
              f"Review screenshots for {os.environ['GITHUB_SHA']} (run {os.environ['GITHUB_SERVER_URL']}/"
              f"{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}). {count} images, "
              "downscaled. Scratch branch: replaced by each complete run.\n")
          print('Published', count, 'review screenshots')
          PY
          cd review
          git init -q -b ci-screenshots
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -qm "Review screenshots for $GITHUB_SHA (run $GITHUB_RUN_ID)"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/ci-screenshots

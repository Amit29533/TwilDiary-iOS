# JellySpace playback performance on the Namespace Apple Silicon runner: the app plays a generated
# 1080p24 video with styled (ASS) subtitles in the Simulator, with the controls hidden, on AetherEngine
# and on mpv, for each commit listed in ios/tools/perf/revs.txt (with this commit's test hook laid
# over it), and the CPU and memory each used are compared in the run's summary. Start it by pushing a tag (`namespace-perf-<short sha>`).
# The Simulator decodes video in software, so the numbers are higher than a phone's; what counts is
# the difference between the two commits. Read-only: no signing, no release, no deploy.
name: iOS performance (Namespace)
run-name: namespace perf ${{ github.ref_name }}

on:
  push:
    tags: ['namespace-perf-*']
  workflow_dispatch:

concurrency:
  group: ios-namespace-perf-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  playback:
    runs-on: namespace-profile-mac
    timeout-minutes: 100
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Choose Xcode 26.6 and an iPhone simulator
        run: |
          set -euo pipefail
          dev=""
          for app in /Applications/Xcode_26.6.app $(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V -r) /Applications/Xcode.app; do
            if [ -x "$app/Contents/Developer/usr/bin/xcodebuild" ]; then dev="$app/Contents/Developer"; break; fi
          done
          [ -n "$dev" ] || dev="$(xcode-select -p)"
          echo "DEVELOPER_DIR=$dev" >> "$GITHUB_ENV"
          mkdir -p ios/.artifacts/perf ios/.artifacts/logs
          DEVELOPER_DIR="$dev" xcrun simctl list devices available -j > ios/.artifacts/devices.json
          python3 - <<'PY'
          import json, os, re
          devices = json.load(open('ios/.artifacts/devices.json'))['devices']
          options = [(runtime, d) for runtime, items in devices.items() if 'iOS-26' in runtime
                     for d in items if d['name'].startswith('iPhone') and d.get('isAvailable', True)]
          if not options: raise SystemExit('No iPhone simulator available')
          runtime, device = max(options, key=lambda o: (tuple(map(int, re.findall(r'\d+', o[0]))), 'Pro' in o[1]['name']))
          print('Simulator:', device['name'], runtime)
          open(os.environ['GITHUB_ENV'], 'a').write('SIMULATOR_ID=' + device['udid'] + '\n')
          PY
      - name: Cache Swift packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ios/.spm
          key: spm-namespace-${{ runner.arch }}-${{ hashFiles('ios/**/Package.resolved', 'ios/**/Package.swift', 'ios/project.yml') }}
      - name: Make and serve the test video
        run: |
          set -euo pipefail
          command -v ffmpeg >/dev/null || brew install ffmpeg
          mkdir -p "$RUNNER_TEMP/perf"
          python3 ios/tools/perf/make_subs.py > "$RUNNER_TEMP/perf/subs.ass"
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=1920x1080:rate=24 -f lavfi -i sine=frequency=440:sample_rate=48000 \
            -i "$RUNNER_TEMP/perf/subs.ass" -t 120 -map 0:v -map 1:a -map 2:s -c:v libx264 -preset veryfast -pix_fmt yuv420p \
            -c:a aac -b:a 128k -c:s ass -disposition:s:0 default "$RUNNER_TEMP/perf/perf.mkv"
          ls -l "$RUNNER_TEMP/perf"
          cp ios/tools/perf/serve.py "$RUNNER_TEMP/serve.py"
          nohup python3 "$RUNNER_TEMP/serve.py" "$RUNNER_TEMP/perf" 8765 > "$RUNNER_TEMP/serve.log" 2>&1 &
          sleep 1
          curl -sf -r 0-15 -o /dev/null -w 'range request: %{http_code}\n' http://127.0.0.1:8765/perf.mkv
      - name: Measure the listed commits
        run: |
          # Not -e (GitHub's bash default): a build that fails is reported in the table and the next
          # commit is still measured.
          set +e
          set -uo pipefail
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b || true
          cp ios/tools/perf/measure.sh "$RUNNER_TEMP/measure.sh"
          cp ios/tools/perf/revs.txt "$RUNNER_TEMP/revs.txt"
          here=$(git rev-parse HEAD)
          {
            echo "### JellySpace playback, controls hidden (Simulator, 45 s)"
            echo
            echo "| Build | CPU used (avg) | CPU sampled (median) | CPU peak | Memory peak |"
            echo "|---|---|---|---|---|"
          } > ios/.artifacts/perf/results.md
          # The list on its own file handle (3), so nothing in the loop reads it from standard input.
          while read -r rev name <&3; do
            [ -n "${rev:-}" ] || continue
            short="$name"
            git checkout --force -q "$rev"
            # This commit's test hook, so every listed build opens the player the same way.
            git checkout -q "$here" -- ios/App/TwilDiaryApp.swift ios/App/Screens/JellyPerfHarness.swift
            mkdir -p ios/.artifacts/perf ios/.artifacts/logs
            bash ios/scripts/xcodegen.sh
            xcodebuild build -project ios/TwilDiary.xcodeproj -scheme TwilDiary -configuration Release \
              -clonedSourcePackagesDirPath "$PWD/ios/.spm" CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO \
              -destination "platform=iOS Simulator,id=$SIMULATOR_ID,arch=$(uname -m)" -derivedDataPath "$PWD/ios/.derived/perf-$short" \
              > "ios/.artifacts/logs/build-$short.log" 2>&1
            status=$?
            tail -3 "ios/.artifacts/logs/build-$short.log"
            if [ $status -ne 0 ]; then
              grep -E "error:" "ios/.artifacts/logs/build-$short.log" | head -20
              echo "| $short | build failed | | | |" >> ios/.artifacts/perf/results.md
              continue
            fi
            xcrun simctl install "$SIMULATOR_ID" "$PWD/ios/.derived/perf-$short/Build/Products/Release-iphonesimulator/TwilDiary.app"
            bash "$RUNNER_TEMP/measure.sh" "$SIMULATOR_ID" "$short AetherEngine"
            bash "$RUNNER_TEMP/measure.sh" "$SIMULATOR_ID" "$short mpv" --jellyspace-perf-mpv
            # mpv with its subtitles composited into the frames (a launch argument sets the default).
            bash "$RUNNER_TEMP/measure.sh" "$SIMULATOR_ID" "$short mpv composited" --jellyspace-perf-mpv -jellyspace.mpv.compositeOSD YES
            xcrun simctl uninstall "$SIMULATOR_ID" com.amit29533.TwilDiary || true
            mkdir -p ios/.artifacts/perf/crashes
            cp ~/Library/Logs/DiagnosticReports/TwilDiary* ios/.artifacts/perf/crashes/ 2>/dev/null || true
          done 3< "$RUNNER_TEMP/revs.txt"
          git checkout --force -q "$here"
          cat ios/.artifacts/perf/results.md
          cat ios/.artifacts/perf/results.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TwilDiary-perf
          path: ios/.artifacts
          include-hidden-files: true
          retention-days: 7

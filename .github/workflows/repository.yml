name: Native repository and backend verification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: repository-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install the backend from this repository's lockfile
        run: npm ci
      - name: Verify release and migration tools without hosted access
        run: python3 -m unittest discover -s ios/tools -p 'test_*.py'
      - name: Typecheck the native API and scheduled Worker
        run: |
          npm run check
          npx tsc -p workers/trakt-incoming/tsconfig.json
      - name: Test local API database and shared business rules
        run: npm test
      - name: Compile the existing Cloudflare backend without deploying
        run: npm run build

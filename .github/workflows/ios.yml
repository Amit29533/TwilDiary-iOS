name: Native iOS
on:
  push:
    branches: [main]
    paths: ['TwilDiary/**', 'TwilDiaryUITests/**', 'Packages/**', 'project.yml', '.github/workflows/ios.yml']
  pull_request:
    paths: ['TwilDiary/**', 'TwilDiaryUITests/**', 'Packages/**', 'project.yml', '.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test shared diary logic
        run: swift test --package-path Packages/TwilDiaryCore
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Pick an available iPhone simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for k,vs in sorted(d["devices"].items(), reverse=True) if "iOS" in k for v in vs if "iPhone" in v["name"]))')
          echo "SIMULATOR_ID=$DEVICE" >> "$GITHUB_ENV"
      - name: Compile native screens
        id: compile
        timeout-minutes: 15
        run: |
          xcodebuild build-for-testing -project TwilDiary.xcodeproj -scheme TwilDiary \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO
      - name: Compile for physical iOS devices
        id: device
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: |
          xcodebuild build -project TwilDiary.xcodeproj -scheme TwilDiary \
            -destination 'generic/platform=iOS' -configuration Release \
            -derivedDataPath device-build CODE_SIGNING_ALLOWED=NO
      - name: Package unsigned IPA for LiveContainer
        if: ${{ !cancelled() && steps.device.outcome == 'success' }}
        run: |
          mkdir -p artifacts/Payload
          cp -R device-build/Build/Products/Release-iphoneos/TwilDiary.app artifacts/Payload/
          cd artifacts
          ditto -c -k --keepParent Payload TwilDiary-LiveContainer.ipa
          shasum -a 256 TwilDiary-LiveContainer.ipa > TwilDiary-LiveContainer.ipa.sha256
      - name: Upload LiveContainer IPA
        if: ${{ !cancelled() && steps.device.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TwilDiary-LiveContainer-IPA
          path: |
            artifacts/TwilDiary-LiveContainer.ipa
            artifacts/TwilDiary-LiveContainer.ipa.sha256
          retention-days: 14
      - name: Boot the iPhone simulator
        timeout-minutes: 6
        run: |
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
      - name: Run iPhone UI tests
        timeout-minutes: 12
        run: |
          xcodebuild test-without-building -project TwilDiary.xcodeproj -scheme TwilDiary \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -parallel-testing-enabled NO \
            -derivedDataPath build -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO
      - name: Upload simulator application
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TwilDiary-iOS-Simulator
          path: build/Build/Products/Debug-iphonesimulator/TwilDiary.app
          retention-days: 7
      - name: Upload simulator test results and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TwilDiary-iOS-TestResults
          path: TestResults.xcresult
          retention-days: 7
      - name: Export screen captures for visual review
        if: always()
        run: |
          if [ -f TestResults.xcresult/Info.plist ]; then
            xcrun xcresulttool export attachments --path TestResults.xcresult --output-path screenshots
          fi
      - name: Upload screen captures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TwilDiary-iOS-Screenshots
          path: screenshots
          retention-days: 7
